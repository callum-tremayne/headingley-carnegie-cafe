<script>
  document.addEventListener("DOMContentLoaded", function () {
    var collapsibles = document.getElementsByClassName("collapsible");
    Array.from(collapsibles).forEach(function (collapsible) {
      collapsible.addEventListener("click", function () {
        // Close all other accordions
        Array.from(collapsibles).forEach(function (other) {
          if (other !== collapsible) {
            other.classList.remove("active");
            other.nextElementSibling.style.maxHeight = null;
          }
        });

        // Toggle the clicked accordion
        this.classList.toggle("active");
        var content = this.nextElementSibling;
        if (content.style.maxHeight) {
          content.style.maxHeight = null;
        } else {
          content.style.maxHeight = content.scrollHeight + "px";
        }
      });
    });
  });
</script>
<script>
  // Define spreadsheet URL.
  var carnegieCafe =
    "https://docs.google.com/spreadsheets/d/1TkWMu07wdjNvzfwwqlF4_fehEElZt-3Nc2xgU-vIGHE/edit?gid=1104241546#gid=1104241546";

  var BreakfastSandwiches = Handlebars.compile(
    $("#breakfastSandwiches-template").html()
  );

  $("#breakfastSandwiches").sheetrock({
    url: carnegieCafe,
    query: "select A, B where A is not null",
    rowTemplate: BreakfastSandwiches,
  });
</script>
